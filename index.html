var cur=-1, frame=null;
var $=function(i){return document.getElementById(i)};

function decode(b64){
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function buildMenu(){
  var list=$('list'), g='';
  PAGES.forEach(function(p,i){
    if(p.g!==g){g=p.g;var h=document.createElement('div');h.className='grp';h.textContent=g;list.appendChild(h)}
    var b=document.createElement('button');
    b.className='item';b.type='button';b.dataset.i=i;
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="tx"><b></b><small></small></span>';
    b.querySelector('b').textContent=p.t;
    b.querySelector('small').textContent=p.s;
    b.addEventListener('click',function(){go(i);toggle(false)});
    list.appendChild(b);
  });
}
function go(i,noHash){
  if(i<0||i>=PAGES.length||i===cur) return;
  cur=i;
  var p=PAGES[i];
  var html=decode(p.b);
  var st=$('stage');
  if(frame) frame.remove();
  st.innerHTML='';
  frame=document.createElement('iframe');
  frame.title=p.t;
  frame.srcdoc=html;
  st.appendChild(frame);
  $('ct').textContent=p.t;
  $('cs').textContent=p.s;
  document.title=p.t+' — 5-bob';
  $('prev').disabled=(i===0);
  $('next').disabled=(i===PAGES.length-1);
  document.querySelectorAll('.item').forEach(function(el){
    var on=(+el.dataset.i===i);
    if(on) el.setAttribute('aria-current','true'); else el.removeAttribute('aria-current');
  });
  if(!noHash){try{history.replaceState(null,'','#s'+(i+1))}catch(e){location.hash='s'+(i+1)}}
}
function toggle(open){
  if(open===undefined) open=!document.body.classList.contains('open');
  document.body.classList.toggle('open',open);
  $('mb').setAttribute('aria-expanded',open);
  if(open){
    var c=document.querySelector('.item[aria-current=true]');
    if(c) c.scrollIntoView({block:'center'});
    $('cl').focus();
  } else {$('mb').focus()}
}
$('mb').addEventListener('click',function(){toggle()});
$('cl').addEventListener('click',function(){toggle(false)});
